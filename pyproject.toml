[project]
name = "agentgate"
version = "0.1.0"
description = "A free safety layer for AI agents: two open decision models check every tool call, and only unclear or risky ones reach your phone."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rohit" }]
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-groq>=1.1,<2",
    "langchain-google-genai>=4.4,<5",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "typer>=0.27",
    "rich>=15",
    "segno>=1.6",
    "pypdf>=6",
]

[project.optional-dependencies]
# Everything the benchmark needs on top of the agent: the trained baseline and the charts.
eval = [
    "fastembed>=0.8",
    "scikit-learn>=1.9",
    "numpy>=2",
    "matplotlib>=3.11",
    "joblib>=1.4",
]

[project.scripts]
agentgate = "agentgate.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.63",
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
